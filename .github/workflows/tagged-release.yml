name: 'tagged-release'

on:
  push:
    tags:
      - 'v*'

jobs:
  linux-windows-build:
    runs-on: 'ubuntu-latest'

    permissions: write-all

    outputs:
      upload_url: ${{ steps.automatic_releases.outputs.upload_url }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Init submodules
        run: git submodule update --init --checkout --recursive
      - name: Build release image
        run: docker compose -f compose.release.yml build release
      - name: Build Linux and Windows artifacts
        run: docker compose -f compose.release.yml run --rm release

      - uses: 'marvinpinto/action-automatic-releases@latest'
        id: 'automatic_releases'
        with:
          repo_token: '${{ secrets.GITHUB_TOKEN }}'
          automatic_release_tag: ${{ github.ref_name }}
          prerelease: false
          files: |
            dist/*.deb
            dist/*.snap
            dist/*.AppImage
            dist/*.exe
            outputs/*.zip

  mac-build:
    runs-on: 'macos-latest'

    permissions: write-all

    needs: linux-windows-build

    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - run: npm ci
      - run: npm run build
      # Hard links fail with EEXIST while electron-builder copies unpacked resources.
      - run: npm run bundle:mac
        env:
          USE_HARD_LINKS: 'false'

      - name: Extract asset name
        id: extract_asset_name
        run: |
          (cd dist && ls -1 *.dmg) >> asset_name.txt
          echo "asset_name=$(cat asset_name.txt | head -n 1)" >> $GITHUB_OUTPUT

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.linux-windows-build.outputs.upload_url }}
          asset_path: ./dist/${{ steps.extract_asset_name.outputs.asset_name }}
          asset_name: ${{ steps.extract_asset_name.outputs.asset_name }}
          asset_content_type: application/octet-stream
